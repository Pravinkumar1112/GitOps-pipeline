apiVersion: apps/v1
kind: Deployment
metadata:
  name: new-deploy
  labels:
    app: nginx
spec:
  replicas: 5
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: pravinchopy/gitops-demo
          ports:
            - containerPort: 80
